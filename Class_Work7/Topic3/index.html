<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fieldset & Table Practice</title>
  </head>
  <body>
    <h1>Form Practice</h1>

    <form>
      <!-- Personal Info -->
      <fieldset>
        <legend>Personal Info</legend>
        <label>Name:</label><br />
        <input type="text" /><br /><br />

        <label>Email:</label><br />
        <input type="email" /><br /><br />
      </fieldset>

      <br />

      <!-- Contact Details -->
      <fieldset>
        <legend>Contact Details</legend>
        <label>Phone:</label><br />
        <input type="text" /><br /><br />

        <label>Address:</label><br />
        <input type="text" /><br /><br />
      </fieldset>

      <br />

      <!-- Login Details -->
      <fieldset>
        <legend>Login Details</legend>
        <label>Username:</label><br />
        <input type="text" /><br /><br />

        <label>Password:</label><br />
        <input type="password" /><br /><br />
      </fieldset>
    </form>

    <hr />

    <h1>Table Practice</h1>

    <table border="1">
      <caption>
        Student Data
      </caption>
      <tr>
        <th>Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Raj</td>
        <td>23</td>
      </tr>
      <tr>
        <td>Aman</td>
        <td>22</td>
      </tr>
    </table>
  </body>
</html>
