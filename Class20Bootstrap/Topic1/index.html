<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Display & Buttons</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">

  <h1>Bootstrap Practice</h1>

  <!-- 1. Hidden div -->
  <h2>d-none</h2>
  <div class="d-none box">Hidden Div</div>

  <!-- 2. Three boxes (second hidden) -->
  <div class="box">Box 1</div>
  <div class="box d-none">Box 2 (Hidden)</div>
  <div class="box">Box 3</div>

  <!-- 3 & 4. Span to block -->
  <h2>d-block</h2>
  <span class="d-block">Span 1 (block)</span>
  <span class="d-block">Span 2 (block)</span>

  <!-- 5 & 6. Div inline -->
  <h2>d-inline</h2>
  <div class="d-inline box">Div 1</div>
  <div class="d-inline box">Div 2</div>
  <div class="d-inline box">Div 3</div>

  <!-- Buttons -->
  <h2>Buttons</h2>

  <!-- 7. Simple button -->
  <button class="btn">Simple Button</button>

  <!-- 8. Primary button -->
  <button class="btn btn-primary">Primary Button</button>

  <!-- 9. Multiple buttons -->
  <button class="btn btn-success">Success</button>
  <button class="btn btn-danger">Danger</button>
  <button class="btn btn-warning">Warning</button>

  <!-- 10. Outline button -->
  <button class="btn btn-outline-primary">Outline Button</button>

  <!-- 11. Sizes -->
  <button class="btn btn-primary btn-lg">Large Button</button>
  <button class="btn btn-secondary btn-sm">Small Button</button>

  <!-- 12. Full width -->
  <button class="btn btn-primary w-100">Full Width Button</button>

  <!-- 13. Active button -->
  <button class="btn btn-primary active">Active Button</button>

  <!-- 14. Disabled button -->
  <button class="btn btn-secondary" disabled>Disabled Button</button>

  <!-- 15. Link as button -->
  <a href="#" class="btn btn-success">Link Button</a>

</body>
</html>
