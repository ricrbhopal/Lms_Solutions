<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form & Flex Practice</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Optional External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">

  <h1>Bootstrap Form & Flex Practice</h1>

  <!-- FORM SECTION -->
  <h2>Form Controls</h2>

  <!-- Name & Email -->
  <input type="text" class="form-control mb-2" placeholder="Name">
  <input type="email" class="form-control mb-2" placeholder="Email">

  <!-- Sizes -->
  <input type="text" class="form-control form-control-sm mb-2" placeholder="Small">
  <input type="text" class="form-control mb-2" placeholder="Default">
  <input type="text" class="form-control form-control-lg mb-2" placeholder="Large">

  <!-- Textarea -->
  <textarea class="form-control mb-2" placeholder="Message"></textarea>

  <!-- Select -->
  <select class="form-control mb-2">
    <option>Select Option</option>
    <option>Option 1</option>
    <option>Option 2</option>
  </select>

  <!-- File -->
  <input type="file" class="form-control mb-2">

  <!-- Disabled & Readonly -->
  <input type="text" class="form-control mb-2" value="Disabled Input" disabled>
  <input type="text" class="form-control mb-2" value="Readonly Input" readonly>

  <!-- Checkbox -->
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="check1">
    <label class="form-check-label" for="check1">Accept Terms</label>
  </div>

  <!-- Radio -->
  <div class="form-check">
    <input class="form-check-input" type="radio" name="gender" id="male">
    <label class="form-check-label" for="male">Male</label>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="radio" name="gender" id="female">
    <label class="form-check-label" for="female">Female</label>
  </div>

  <!-- FLEX SECTION -->
  <h2>Flexbox</h2>

  <!-- Two items -->
  <div class="d-flex mb-3">
    <div class="box">Item 1</div>
    <div class="box">Item 2</div>
  </div>

  <!-- Three boxes -->
  <div class="d-flex mb-3">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>

  <!-- Center horizontally -->
  <div class="d-flex justify-content-center mb-3">
    <div class="box">Centered</div>
  </div>

  <!-- Space between -->
  <div class="d-flex justify-content-between mb-3">
    <div class="box">Left</div>
    <div class="box">Right</div>
  </div>

  <!-- Vertical center -->
  <div class="d-flex align-items-center mb-3 height-box">
    <div class="box">Vertical Center</div>
  </div>

  <!-- Gap -->
  <div class="d-flex gap-3 mb-3">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
  </div>

  <!-- Combined layout -->
  <div class="d-flex justify-content-between align-items-center border p-2">
    <div>Logo</div>
    <div>Menu</div>
    <div>Profile</div>
  </div>

</body>
</html>
