<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Animation Practice</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>1. Basic Transition</h2>
<div class="box1"></div>

<h2>2. Timing Functions</h2>
<div class="box2 ease"></div>
<div class="box2 linear"></div>
<div class="box2 easein"></div>
<div class="box2 easeout"></div>
<div class="box2 easeinout"></div>

<h2>3. Transform Basics</h2>
<div class="box2 translate"></div>
<div class="box2 rotate"></div>
<div class="box2 scale"></div>

<h2>4. Combined Transform</h2>
<div class="combine"></div>

<h2>5. Transition + Transform</h2>
<div class="box5"></div>

<h2>6. Animation</h2>
<div class="animate"></div>

<h2>7. Real UI</h2>
<button class="button">Hover Me</button>
<div class="card"></div>
<br>
<img src="../Class11/image.png" alt="image">

</body>
</html>
