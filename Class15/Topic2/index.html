<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1 Translate Right -->
    <div class="box move-right">Move Right</div>

    <!-- 2 Move Down Left -->
    <div class="box move-down-left">Down Left</div>

    <!-- 3 Rotate Box -->
    <div class="box rotate-box">Rotate 90°</div>

    <!-- 4 Rotate Image Hover -->
    <img src="https://via.placeholder.com/100" class="rotate-image" alt="image">

    <!-- 5 Scale Twice -->
    <div class="box scale-box">Scale 2x</div>

    <!-- 6 Shrink Button -->
    <button class="shrink-btn">Hover Me</button>

    <!-- 7 Scale X -->
    <div class="box scale-x">Scale X</div>

    <!-- 8 Scale Y -->
    <div class="box scale-y">Scale Y</div>

    <!-- 9 Skew X -->
    <div class="box skew-x">Skew X</div>

    <!-- 10 Skew Y -->
    <div class="box skew-y">Skew Y</div>

    <!-- 11 Translate + Rotate -->
    <div class="box translate-rotate">Translate + Rotate</div>

    <!-- 12 Hover Card Effect -->
    <div class="card hover-card">Hover Card</div>

    <!-- 13 Zoom Image -->
    <img src="https://via.placeholder.com/100" class="zoom-image" alt="zoom">

    <!-- 14 Flip Card -->
    <div class="box flip-card">Flip Me</div>

    <!-- 15 All Combined -->
    <div class="box all-transform">All Transform</div>

</body>
</html>
