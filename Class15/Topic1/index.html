<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1 -->
    <div class="box color-box">Hover Color Box</div>

    <!-- 2 -->
    <button class="btn width-btn">Hover Me</button>

    <!-- 3 -->
    <img src="https://via.placeholder.com/200" class="zoom-img" alt="Zoom Image">

    <!-- 4 -->
    <div class="card resize-card">Resize Card</div>

    <!-- 5 -->
    <div class="delay-box">Delay Move</div>

    <!-- 6 -->
    <div class="opacity-box">Opacity Box</div>

    <!-- 7 -->
    <div class="timing-container">
        <div class="timing linear">Linear</div>
        <div class="timing ease">Ease</div>
        <div class="timing ease-in">Ease-In</div>
        <div class="timing ease-out">Ease-Out</div>
        <div class="timing ease-in-out">Ease-In-Out</div>
    </div>

    <!-- 8 -->
    <p class="menu-item">Hover Menu Item</p>

    <!-- 9 -->
    <div class="shape-box"></div>

    <!-- 10 -->
    <button class="multi-btn">Hover Button</button>

    <!-- 11 -->
    <div class="multi-size-box"></div>

    <!-- 12 -->
    <a href="#" class="nav-link">Navigation Link</a>

    <!-- 13 -->
    <div class="rotate-box">Rotate</div>

    <!-- 14 -->
    <div class="lift-card">Hover Lift Card</div>

    <!-- 15 -->
    <p class="grow-text">Hover Over This Text</p>

</body>
</html>
