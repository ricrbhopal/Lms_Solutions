<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="msg-container hide">
      <p id="msg">Winner</p>
      <button id="new-btn">New Game</button>
    </div>
    <main>
      <h1>Tic Tac Toe</h1>
      <div class="controls">
        <button id="mode-btn">Play vs AI</button>
        <button id="reset-btn">Reset Round</button>
        <button id="new-btn">New Game</button>
      </div>
      <div class="status-bar">
        <p id="game-status">Your turn (O)</p>
        <p id="timer">Time: <span id="timer-value">10</span>s</p>
      </div>
      <div class="scoreboard">
        <div class="score-card">
          <span>You (O)</span>
          <strong id="score-o">0</strong>
        </div>
        <div class="score-card">
          <span>AI / Opponent (X)</span>
          <strong id="score-x">0</strong>
        </div>
        <div class="score-card">
          <span>Draws</span>
          <strong id="score-draw">0</strong>
        </div>
      </div>
      <div class="container">
        <div class="game">
          <button class="box" aria-label="box 1"></button>
          <button class="box" aria-label="box 2"></button>
          <button class="box" aria-label="box 3"></button>
          <button class="box" aria-label="box 4"></button>
          <button class="box" aria-label="box 5"></button>
          <button class="box" aria-label="box 6"></button>
          <button class="box" aria-label="box 7"></button>
          <button class="box" aria-label="box 8"></button>
          <button class="box" aria-label="box 9"></button>
        </div>
      </div>
      <section class="history-panel">
        <h2>Game History</h2>
        <ul id="history-list"></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
