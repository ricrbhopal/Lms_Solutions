<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Basics Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="p-4">

  <h2 class="mb-4">Bootstrap Basics Practice</h2>

  <!-- 1 & 2 -->
  <button class="btn btn-primary mb-3">Bootstrap Button</button>

  <!-- 3 -->
  <div class="mb-4">
    <button class="custom-btn">CSS Button</button>
    <button class="btn btn-success">Bootstrap Button</button>
  </div>

  <!-- 4 -->
  <h4>Advantages of Bootstrap</h4>
  <ul class="mb-4">
    <li>Faster development</li>
    <li>Responsive design</li>
    <li>Predefined classes</li>
  </ul>

  <!-- 5 -->
  <div class="container mb-4">
    <header class="bg-dark text-white p-3 text-center">Header</header>

    <div class="row">
      <div class="col-md-8 p-3 bg-light">Content</div>
      <div class="col-md-4 p-3 bg-secondary text-white">Sidebar</div>
    </div>

    <footer class="bg-dark text-white p-3 text-center">Footer</footer>
  </div>

  <!-- 7 -->
  <p class="text-danger mb-4">
    Comment Bootstrap CDN to test styling removal.
  </p>

  <!-- 8 -->
  <div class="custom-box">Custom CSS Box</div>
  <div class="border p-3 mb-4">Bootstrap Box</div>

  <!-- 9 -->
  <div class="text-center mb-4">
    <h3 class="text-primary">Bootstrap Only Section</h3>
    <p class="text-muted">No custom CSS here</p>
    <button class="btn btn-warning">Click Me</button>
  </div>

  <!-- 10 -->
  <button class="btn btn-primary">Primary Button</button>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
