<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Vendor Prefixes Practical Examples</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Browser Vendor Prefixes Practical Examples</h1>

<!-- 1 Box Shadow -->
<div class="box-shadow-box">Box Shadow Example</div>

<!-- 2 Border Radius Button -->
<button class="rounded-btn">Rounded Button</button>

<!-- 3 Rotate Transform -->
<div class="rotate-box">Rotate 45°</div>

<!-- 4 Transition Effect -->
<button class="transition-btn">Hover Me</button>

<!-- 5 Moving Animation -->
<div class="moving-box"></div>

<!-- 6 Gradient Background -->
<div class="gradient-box">Gradient Background</div>

<!-- 7 Scale Transform -->
<div class="scale-box">Scale Box</div>

<!-- 8 Card Hover Shadow -->
<div class="card">Hover Card</div>

<!-- 9 Flex Container -->
<div class="flex-container">
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div>
</div>

<!-- 10 User Select None -->
<p class="no-select">You cannot select this text.</p>

<!-- 11 Rotating Image -->
<img src="https://via.placeholder.com/100" class="rotate-img" alt="Rotating Image">

<!-- 12 TranslateX -->
<div class="move-div">Move Right</div>

<!-- 13 Zoom Hover Image -->
<img src="https://via.placeholder.com/150" class="zoom-img" alt="Zoom Image">

<!-- 14 Loading Spinner -->
<div class="spinner"></div>

<!-- 15 Rounded Input -->
<input type="text" class="rounded-input" placeholder="Enter text">

</body>
</html>
