<!doctype html>
<html>
  <head>
    <title>Assignments</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="container mt-4">
    <!-- Assignment 1 -->
    <h2>Assignment 1</h2>
    <form id="form1" class="mb-3 rounded">
      <input
        type="text"
        id="name"
        class="form-control mb-2"
        placeholder="Enter Name"
        required
      />
      <input
        type="text"
        id="city"
        class="form-control mb-2"
        placeholder="Enter City"
        required
      />
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <div id="result1" class="result d-flex border rounded-5 shadow"></div>

    <!-- Assignment 2 -->
    <h2>Assignment 2</h2>
    <form id="form2" class="mb-3 rounded">
      <input
        type="email"
        id="email"
        class="form-control mb-2"
        placeholder="Enter Email"
        required
      />
      <input
        type="password"
        id="password"
        class="form-control mb-2"
        placeholder="Enter Password"
        required
      />
      <button type="submit" class="btn btn-success">Submit</button>
    </form>
    <div id="result2" class="result d-flex border rounded-5 shadow"></div>

    <!-- Assignment 3 -->
    <h2>Assignment 3</h2>
    <form id="form3" class="mb-3 rounded">
      <input
        type="text"
        id="firstName"
        class="form-control mb-2"
        placeholder="First Name"
        required
      />
      <input
        type="text"
        id="lastName"
        class="form-control mb-2"
        placeholder="Last Name"
        required
      />
      <button type="submit" class="btn btn-warning">Submit</button>
    </form>
    <div id="result3" class="result d-flex border rounded-5 shadow"></div>

    <script src="script.js"></script>
  </body>
</html>
