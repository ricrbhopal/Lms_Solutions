<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relative & Absolute Examples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1 Relative move -->
<div class="box relative-move">Move Me</div>

<!-- 2 Absolute top-left -->
<div class="parent">
  <div class="child top-left">Top Left</div>
</div>

<!-- 3 Bottom-right -->
<div class="parent">
  <div class="child bottom-right">Bottom Right</div>
</div>

<!-- 4 Notification badge -->
<div class="icon">
  🔔
  <span class="badge">3</span>
</div>

<!-- 5 Overlapping boxes -->
<div class="overlap-container">
  <div class="box1">Box 1</div>
  <div class="box2">Box 2</div>
</div>

<!-- 6 Card with text over image -->
<div class="card">
  <img src="https://via.placeholder.com/300">
  <div class="card-text">Text on Image</div>
</div>

<!-- 7 Tooltip -->
<div class="tooltip-container">
  <button>Hover me</button>
  <span class="tooltip">Tooltip Text</span>
</div>

<!-- 8 Dropdown -->
<div class="dropdown">
  <button>Menu</button>
  <div class="dropdown-menu">
    <p>Item 1</p>
    <p>Item 2</p>
  </div>
</div>

<!-- 9 Center absolute -->
<div class="parent center-parent">
  <div class="center-box">Center</div>
</div>

<!-- 10 Modal -->
<div class="modal">Modal Popup</div>

<!-- 11 z-index stacking -->
<div class="stack">
  <div class="layer1">1</div>
  <div class="layer2">2</div>
  <div class="layer3">3</div>
</div>

<!-- 12 Overlap parent boundary -->
<div class="parent overflow-parent">
  <div class="outside">Outside</div>
</div>

<!-- 13 Ribbon -->
<div class="card ribbon-card">
  <div class="ribbon">NEW</div>
  <p>Card Content</p>
</div>

<!-- 14 Profile card -->
<div class="profile-card">
  <div class="avatar"></div>
  <p>Username</p>
</div>

<!-- 15 Layered UI -->
<div class="layered">
  <div class="bg">Background</div>
  <div class="mid">Middle</div>
  <div class="top">Top</div>
</div>

</body>
</html>
