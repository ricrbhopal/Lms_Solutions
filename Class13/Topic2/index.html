<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixed Position Examples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 2 Fixed Navbar -->
<nav class="navbar">Fixed Navbar</nav>

<!-- 11 Fixed Top Banner -->
<div class="top-banner">Top Fixed Banner</div>

<!-- 8 Fixed Header overlapping -->
<header class="overlap-header">Overlapping Header</header>

<div class="content">
  <h1>Scroll Down</h1>
  <p>Lots of content...</p>
  <p>More content...</p>
  <p>More content...</p>
  <p>More content...</p>
  <p>More content...</p>
  <p>More content...</p>
  <p>More content...</p>
  <p>More content...</p>
</div>

<!-- 1 Bottom-right button -->
<button class="btn-bottom-right">Button</button>

<!-- 3 Back to top -->
<button class="back-to-top">↑ Top</button>

<!-- 4 Chat icon -->
<div class="chat-icon">💬</div>

<!-- 5 Notification -->
<div class="notification">New Message!</div>

<!-- 6 Fixed Sidebar -->
<div class="fixed-sidebar">Sidebar</div>

<!-- 7 Floating Action Button -->
<button class="fab">+</button>

<!-- 9 Fixed Footer -->
<footer class="footer">Fixed Footer</footer>

<!-- 10 Fixed top-left -->
<div class="top-left-box">Top Left</div>

<!-- 12 Floating menu -->
<div class="floating-menu">Menu</div>

<!-- 13 Multiple corners -->
<div class="corner top-right">TR</div>
<div class="corner bottom-left">BL</div>

<!-- 14 Overlap test -->
<div class="overlay-box">Overlay</div>

<!-- 15 Always visible -->
<div class="always-visible">Always Visible</div>

</body>
</html>
