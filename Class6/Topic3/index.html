<!DOCTYPE html>
<html>
<head>
    <title>Form Practice</title>
</head>
<body>

    <h4>1. City Dropdown</h4>
    <form>
        <label for="city1">City:</label>
        <select id="city1">
            <option>Delhi</option>
            <option>Mumbai</option>
            <option>Indore</option>
        </select>
    </form>

    <h4>2. Gender Dropdown</h4>
    <form>
        <label for="gender1">Gender:</label>
        <select id="gender1">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
    </form>

    <h4>3. Course Dropdown</h4>
    <form>
        <label for="course1">Course:</label>
        <select id="course1">
            <option>BCA</option>
            <option>BBA</option>
            <option>MCA</option>
            <option>MBA</option>
        </select>
    </form>

    <h4>4. Dropdown with 5 Options</h4>
    <form>
        <select>
            <option>Option 1</option>
            <option>Option 2</option>
            <option>Option 3</option>
            <option>Option 4</option>
            <option>Option 5</option>
        </select>
    </form>

    <h4>5. Textarea for Address</h4>
    <form>
        <label for="address1">Address:</label><br>
        <textarea id="address1" rows="4" cols="30"></textarea>
    </form>

    <h4>6. Textarea with Placeholder</h4>
    <form>
        <textarea placeholder="Enter your feedback"></textarea>
    </form>

    <h4>7. Textarea with Label</h4>
    <form>
        <label for="message1">Message:</label><br>
        <textarea id="message1"></textarea>
    </form>

    <h4>8. City + Message Form</h4>
    <form>
        <label for="city2">City:</label>
        <select id="city2">
            <option>Delhi</option>
            <option>Mumbai</option>
            <option>Indore</option>
        </select>
        <br><br>
        <label for="message2">Message:</label><br>
        <textarea id="message2"></textarea>
    </form>

    <h4>9. Name, Course, Address Form</h4>
    <form>
        <label for="name1">Name:</label>
        <input type="text" id="name1"><br><br>

        <label for="course2">Course:</label>
        <select id="course2">
            <option>BCA</option>
            <option>BBA</option>
            <option>MCA</option>
            <option>MBA</option>
        </select><br><br>

        <label for="address2">Address:</label><br>
        <textarea id="address2"></textarea>
    </form>

    <h4>10. Complete Form</h4>
    <form>
        <label for="gender2">Gender:</label>
        <select id="gender2">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select><br><br>

        <label for="city3">City:</label>
        <select id="city3">
            <option>Delhi</option>
            <option>Mumbai</option>
            <option>Indore</option>
        </select><br><br>

        <label for="feedback">Feedback:</label><br>
        <textarea id="feedback" placeholder="Enter your feedback"></textarea>
    </form>

</body>
</html>
