<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form - Dance Club</title>
  </head>

  <body>
    <h3>Registration Form: Dance Club</h3>

    <form>
      <table border="1" cellpadding="8">
        <!-- Name -->
        <tr>
          <th><label for="name">Name:</label></th>
          <td>
            <input type="text" id="name" name="name" />
          </td>
        </tr>

        <!-- IC No -->
        <tr>
          <th>IC No:</th>
          <td>
            <input type="text" name="ic1" size="4" /> -
            <input type="text" name="ic2" size="4" /> -
            <input type="text" name="ic3" size="4" />
          </td>
        </tr>

        <!-- Address -->
        <tr>
          <th><label for="address">Address:</label></th>
          <td>
            <textarea id="address" name="address" rows="5" cols="50"></textarea>
          </td>
        </tr>

        <!-- Gender -->
        <tr>
          <th>Gender:</th>
          <td>
            <input type="radio" id="male" name="gender" value="male" />
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Female</label>
          </td>
        </tr>

        <!-- Dance Type -->
        <tr>
          <th>Dance Type:</th>
          <td>
            <input type="checkbox" id="zapin" name="dance" value="Zapin" />
            <label for="zapin">Zapin</label>

            <input type="checkbox" id="joget" name="dance" value="Joget" />
            <label for="joget">Joget</label>

            <input type="checkbox" id="inang" name="dance" value="Inang" />
            <label for="inang">Inang</label>

            <input type="checkbox" id="lion" name="dance" value="Lion Dance" />
            <label for="lion">Lion Dance</label>
          </td>
        </tr>

        <!-- Competition -->
        <tr>
          <th>Competition:</th>
          <td>
            <select name="competition">
              <option value="">--Select--</option>
              <option value="state">State Level</option>
              <option value="national">National Level</option>
              <option value="international">International Level</option>
            </select>
          </td>
        </tr>

        <!-- Nationality -->
        <tr>
          <th>Nationality:</th>
          <td>
            <select name="nationality">
              <option value="">--Please Select--</option>
              <option value="indian">Indian</option>
              <option value="us">US</option>
              <option value="russian">Russian</option>
              <option value="japanese">Japanese</option>
              <option value="nepali">Nepali</option>
            </select>
          </td>
        </tr>

        <!-- Password -->
        <tr>
          <th><label for="password">Password:</label></th>
          <td>
            <input type="password" id="password" name="password" />
          </td>
        </tr>
      </table>

      <br />

      <!-- Buttons -->
      <button type="submit">Register Me</button>
      <button type="reset">Cancel</button>
    </form>
  </body>
</html>
