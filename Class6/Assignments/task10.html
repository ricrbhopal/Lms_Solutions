<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form Task 10</title>
  </head>

  <body>
    <form>
      <fieldset>
        <legend>Registration Form</legend>

        <p>
          Of course, all submitted information is kept in the strictest
          confidence.<br />
          You always retain control of your information with D.W. Simpson &
          Co.<br />
          <b>Our services are always at no cost to you.</b>
        </p>

        <!-- Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" />
        <br /><br />

        <!-- Address -->
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" />
        <br /><br />

        <!-- City & State -->
        <label for="city">City:</label>
        <input type="text" id="city" name="city" />

        <label for="state">State/Province:</label>
        <input type="text" id="state" name="state" />
        <br /><br />

        <!-- Zip -->
        <label for="zip">Zip Code:</label>
        <input type="text" id="zip" name="zip" />
        <br /><br />

        <!-- Country -->
        <label for="country">Country:</label>
        <input type="text" id="country" name="country" />
        <br /><br />

        <!-- Phone -->
        <label for="phone_home">Phone (H):</label>
        <input type="tel" id="phone_home" name="phone_home" />

        <label for="fax">Fax:</label>
        <input type="text" id="fax" name="fax" />
        <br /><br />

        <label for="phone_work">Phone (W):</label>
        <input type="tel" id="phone_work" name="phone_work" />
        (if able to speak freely)
        <br /><br />

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" />
        <br /><br />

        <!-- Company -->
        <label for="company">Company Name:</label>
        <input type="text" id="company" name="company" />
        (Optional)
        <br /><br />

        <!-- Region -->
        <label for="region">Desired Region:</label>
        <select id="region" name="region">
          <option value="">--Select--</option>
          <option value="one">One</option>
          <option value="two">Two</option>
          <option value="three">Three</option>
          <option value="other">Other</option>
        </select>

        <label for="other_region">Other:</label>
        <input type="text" id="other_region" name="other_region" />
        <br /><br />

        <!-- Designations -->
        <p><b>Professional designations earned:</b></p>

        <input
          type="checkbox"
          id="college"
          name="designation"
          value="College Student"
        />
        <label for="college">College Student</label>

        <input
          type="checkbox"
          id="actuarial"
          name="designation"
          value="Actuarial Student"
        />
        <label for="actuarial">Actuarial Student</label>

        <input type="checkbox" id="acas" name="designation" value="ACAS" />
        <label for="acas">ACAS</label>

        <input type="checkbox" id="fcas" name="designation" value="FCAS" />
        <label for="fcas">FCAS</label>

        <input type="checkbox" id="asa" name="designation" value="ASA" />
        <label for="asa">ASA</label>
        <br />

        <input type="checkbox" id="fsa" name="designation" value="FSA" />
        <label for="fsa">FSA</label>

        <input type="checkbox" id="ea" name="designation" value="EA" />
        <label for="ea">EA</label>

        <input type="checkbox" id="cfa" name="designation" value="CFA" />
        <label for="cfa">CFA</label>

        <input type="checkbox" id="mba" name="designation" value="MBA" />
        <label for="mba">MBA</label>

        <input type="checkbox" id="maaa" name="designation" value="MAAA" />
        <label for="maaa">MAAA</label>
        <br />

        <input type="checkbox" id="fla" name="designation" value="FLA" />
        <label for="fla">FLA</label>

        <input type="checkbox" id="fcla" name="designation" value="FCLA" />
        <label for="fcla">FCLA</label>

        <input type="checkbox" id="flaa" name="designation" value="FLAA" />
        <label for="flaa">FLAA</label>

        <input
          type="checkbox"
          id="fe"
          name="designation"
          value="Financial Engineer"
        />
        <label for="fe">Financial Engineer</label>
        <br />

        <input type="checkbox" id="ms" name="designation" value="MS" />
        <label for="ms">M.S.</label>

        <input type="checkbox" id="phd" name="designation" value="PhD" />
        <label for="phd">Ph.D.</label>

        <input type="checkbox" id="dm" name="designation" value="Data Mining" />
        <label for="dm">Data Mining</label>

        <input type="checkbox" id="quant" name="designation" value="Quant" />
        <label for="quant">Quant</label>
        <br /><br />

        <!-- Other -->
        <label for="other_designation">Other Designations:</label>
        <input type="text" id="other_designation" name="other_designation" />
        <br /><br />

        <!-- Buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </fieldset>
    </form>
  </body>
</html>
