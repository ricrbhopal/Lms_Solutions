<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form Task 11</title>
  </head>

  <body>
    <form>
      <table border="1" cellpadding="8">
        <tr>
          <th colspan="4">Registration Form</th>
        </tr>

        <!-- Student Name -->
        <tr>
          <td>Student Name</td>
          <td>
            <input type="text" name="first_name" placeholder="First Name" />
          </td>
          <td>
            <input type="text" name="middle_name" placeholder="Middle Name" />
          </td>
          <td>
            <input type="text" name="last_name" placeholder="Last Name" />
          </td>
        </tr>

        <!-- Parents -->
        <tr>
          <td>Father's Name</td>
          <td>
            <input
              type="text"
              name="father_name"
              placeholder="Enter Father's Name"
            />
          </td>
          <td>Mother's Name</td>
          <td>
            <input
              type="text"
              name="mother_name"
              placeholder="Enter Mother's Name"
            />
          </td>
        </tr>

        <!-- DOB & Gender -->
        <tr>
          <td>Date of Birth</td>
          <td><input type="date" name="dob" /></td>

          <td>Gender</td>
          <td>
            <input type="radio" id="male" name="gender" value="male" />
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Female</label>
          </td>
        </tr>

        <!-- Category & Handicapped -->
        <tr>
          <td>Category</td>
          <td>
            <input type="radio" id="gen" name="category" value="gen" />
            <label for="gen">Gen</label>

            <input type="radio" id="obc" name="category" value="obc" />
            <label for="obc">OBC</label>

            <input type="radio" id="scst" name="category" value="scst" />
            <label for="scst">SC/ST</label>
          </td>

          <td>Handicapped</td>
          <td>
            <input type="radio" id="handi_yes" name="handicapped" value="yes" />
            <label for="handi_yes">Yes</label>

            <input type="radio" id="handi_no" name="handicapped" value="no" />
            <label for="handi_no">No</label>
          </td>
        </tr>

        <!-- Ex-Serviceman & EWS -->
        <tr>
          <td>Ex-Serviceman</td>
          <td>
            <input type="radio" id="ex_yes" name="exserviceman" value="yes" />
            <label for="ex_yes">Yes</label>

            <input type="radio" id="ex_no" name="exserviceman" value="no" />
            <label for="ex_no">No</label>
          </td>

          <td>EWS</td>
          <td>
            <input type="radio" id="ews_yes" name="ews" value="yes" />
            <label for="ews_yes">Yes</label>

            <input type="radio" id="ews_no" name="ews" value="no" />
            <label for="ews_no">No</label>
          </td>
        </tr>

        <!-- Contact -->
        <tr>
          <td>Email ID</td>
          <td><input type="email" name="email" /></td>

          <td>Mobile No.</td>
          <td><input type="tel" name="mobile" /></td>
        </tr>

        <!-- State & City -->
        <tr>
          <td>State</td>
          <td>
            <select name="state">
              <option value="">Select State</option>
              <option>Uttar Pradesh</option>
              <option>Maharashtra</option>
              <option>Delhi</option>
            </select>
          </td>

          <td>City</td>
          <td>
            <select name="city">
              <option value="">Select City</option>
              <option>Lucknow</option>
              <option>Mumbai</option>
              <option>Delhi</option>
            </select>
          </td>
        </tr>

        <!-- Upload -->
        <tr>
          <td>Upload Photo</td>
          <td><input type="file" name="photo" accept="image/*" /></td>

          <td>Upload Signature</td>
          <td><input type="file" name="signature" accept="image/*,.pdf" /></td>
        </tr>

        <!-- Submit -->
        <tr>
          <td></td>
          <td colspan="3" align="center">
            <button type="submit">Submit</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
