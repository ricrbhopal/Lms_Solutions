<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Appointment Form</title>
  </head>

  <body>
    <form>
      <table align="center" cellpadding="8">
        <tr>
          <!-- Image -->
          <td>
            <img src="./image.png" alt="Doctor Image" width="208" />
          </td>

          <!-- Form -->
          <td>
            <h3>Doctor Appointment Form</h3>
            <hr />

            <!-- Date -->
            <label for="appointment_date">Appointment Date:</label>
            <input type="date" id="appointment_date" name="appointment_date" />
            <br /><br />

            <!-- Time -->
            <label for="appointment_time">Appointment Time:</label>
            <input type="time" id="appointment_time" name="appointment_time" />
            <br /><br />

            <!-- Name -->
            <label>Full Name:</label>
            <input
              type="text"
              id="first_name"
              name="first_name"
              placeholder="First"
            />
            <input
              type="text"
              id="last_name"
              name="last_name"
              placeholder="Last"
            />
            <br /><br />

            <!-- Gender -->
            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="male" />
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Female</label>
            <br /><br />

            <!-- Phone -->
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="####" />
            <br /><br />

            <!-- Address -->
            <label>Address:</label>
            <input type="text" id="city" name="city" placeholder="City" />
            <input type="text" id="state" name="state" placeholder="State" />
            <br /><br />

            <!-- Query -->
            <label for="query">Your Query:</label><br />
            <textarea id="query" name="query" rows="3" cols="25"></textarea>
            <br /><br />

            <!-- Appointment Type -->
            <p><b>Appointment Type</b></p>
            <span>Select which appointment type(s) you require:</span><br />

            <input
              type="checkbox"
              id="cervix"
              name="appointment_type"
              value="cervix"
            />
            <label for="cervix">Cervix Checkup</label><br />

            <input
              type="checkbox"
              id="heart"
              name="appointment_type"
              value="heart"
            />
            <label for="heart">Heart Checkup</label><br />

            <input
              type="checkbox"
              id="eye"
              name="appointment_type"
              value="eye"
            />
            <label for="eye">Eye Check-up</label><br />

            <input
              type="checkbox"
              id="hearing"
              name="appointment_type"
              value="hearing"
            />
            <label for="hearing">Hearing Test</label><br /><br />

            <!-- Button -->
            <button type="submit">Send</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
