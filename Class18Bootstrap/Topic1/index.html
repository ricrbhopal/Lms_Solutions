<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Practice Questions</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h2>Practice Questions (HTML + External CSS)</h2>

    <div class="box border-primary">Border Primary</div>

    <!-- 3 -->
    <div class="box border-1">Border 1</div>
    <div class="box border-3">Border 3</div>

    <!-- 9 -->
