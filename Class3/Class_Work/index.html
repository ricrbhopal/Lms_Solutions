<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Welcome to My Website</h1>
    <p>This is my paragraph.</p>

    <!-- 2. Bold “Important:” followed by normal text -->

    <p><b>Important:</b> This is normal text.</p>

    <!-- 3. Bold, Italic, and Underlined text (separate lines) -->

    <p><b>This is bold text</b></p>
    <p><i>This is italic text</i></p>
    <p><u>This is underlined text</u></p>

    <!-- 4. Formula using superscript (E = mc²) -->

    <p>E = mc<sup>2</sup></p>

    <!-- 5. Subscript (CO₂) -->

    <p>CO<sub>2</sub></p>

    <!-- 6. “Hello” and “World” on different lines -->

    <p>Hello<br />World</p>

    <!-- 7. Horizontal line + explanation -->

    <p>This is first section</p>
    <hr />
    <p>This is second section</p>
  </body>
</html>
