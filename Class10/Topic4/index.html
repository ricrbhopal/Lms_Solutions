<!doctype html>
<html>
  <head>
    <title>CSS Shadow Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1 class="heading-shadow">Heading with Shadow</h1>

    <div class="box-shadow">Box with shadow</div>

    <p class="text-shadow">Paragraph with text shadow</p>

    <h2 class="styled-heading">Styled Heading</h2>

    <div class="box-style">Styled Box</div>

    <div class="blur-box">Blur Shadow Box</div>

    <div class="position-box">Position Shadow Box</div>

    <div class="color-box">Colored Shadow</div>

    <div class="inset-box">Inset Shadow</div>

    <h3>Shadow Directions</h3>
    <div class="left">Left Shadow</div>
    <div class="right">Right Shadow</div>
    <div class="top">Top Shadow</div>
    <div class="bottom">Bottom Shadow</div>

    <div class="ui-box">
      <h2 class="ui-heading">UI Card</h2>
      <p>Shadow + Design Example</p>
    </div>
  </body>
</html>
