<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RegEx Validation</title>
  </head>
  <body>
    <!-- Q1 & Q2 -->
    <input type="text" id="name1" placeholder="Enter Name" />
    <button id="btn1">Validate Name</button>

    <!-- Q3 -->
    <input type="text" id="email" placeholder="Enter Email" />
    <button id="btn2">Validate Email</button>

    <!-- Q4 -->
    <input type="text" id="phone" placeholder="Enter Phone" />
    <button id="btn3">Validate Phone</button>

    <!-- Q5 -->
    <input type="password" id="password" placeholder="Enter Password" />
    <button id="btn4">Validate Password</button>

    <!-- Q7 -->
    <h3>Multiple Inputs</h3>
    <input type="text" id="name2" placeholder="Name" />
    <input type="text" id="email2" placeholder="Email" />
    <input type="text" id="phone2" placeholder="Phone" />
    <button id="btn5">Validate All</button>

    <!-- Q10 -->
    <h3>Form Validation</h3>
    <form id="form1">
      <input type="text" id="fname" placeholder="Name" />
      <input type="text" id="femail" placeholder="Email" />
      <input type="text" id="fphone" placeholder="Phone" />
      <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>
