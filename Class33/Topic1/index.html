<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Hendling</title>
  </head>
  <body>
    <!-- Q1 -->
    <input type="text" id="input1" placeholder="Enter text" />
    <button id="btn1">Get Value</button>
    <!-- Q2 & Q3 -->
    <input type="checkbox" id="check1" /> Subscribe
    <button id="btn2">Check Status</button>
    <!-- Q4 -->
    <input type="radio" name="gender" value="Male" /> Male
    <input type="radio" name="gender" value="Female" /> Female
    <button id="btn3">Get Gender</button>

    <!-- Q5 -->
    <select id="city">
      <option value="Bhopal">Bhopal</option>
      <option value="Delhi">Delhi</option>
    </select>
    <button id="btn4">Get City</button>

    <!-- Q6 -->
    <input type="file" id="fileInput" />
    <button id="btn5">Get File Name</button>

    <!-- Q7 -->
    <input type="text" id="name1" placeholder="Name" />
    <input type="checkbox" id="agree" /> Agree
    <button id="btn6">Show Data</button>

    <!-- Q8 -->
    <input type="radio" name="gender2" value="Male" /> Male
    <input type="radio" name="gender2" value="Female" /> Female

    <select id="city2">
      <option value="Bhopal">Bhopal</option>
      <option value="Indore">Indore</option>
    </select>
    <button id="btn7">Show Selection</button>

    <!-- Q9 -->
    <input type="text" id="input9" placeholder="Type here" />

    <!-- Q10 -->
    <input type="text" id="name2" placeholder="Name" />
    <input type="checkbox" id="check2" /> Agree

    <select id="city3">
      <option value="Bhopal">Bhopal</option>
      <option value="Mumbai">Mumbai</option>
    </select>
    <button id="btn8">Show All</button>

    <script src="script.js"></script>
  </body>
</html>
