<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form Task 3</title>
  </head>
  <body>
    <form>
      <h2>Registration Form</h2>

      <!-- First Name -->
      <label for="firstname">First Name:</label>
      <input
        type="text"
        id="firstname"
        name="firstname"
        placeholder="Enter First Name"
      />
      <br /><br />

      <!-- Last Name -->
      <label for="lastname">Last Name:</label>
      <input
        type="text"
        id="lastname"
        name="lastname"
        placeholder="Enter Last Name"
      />
      <br /><br />

      <!-- Email -->
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter Email Address"
      />
      <br /><br />

      <!-- Password -->
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" />
      <br /><br />

      <!-- Gender -->
      <label>Gender:</label><br />
      <input type="radio" id="male" name="gender" value="male" />
      <label for="male">Male</label><br />

      <input type="radio" id="female" name="gender" value="female" />
      <label for="female">Female</label><br />

      <input type="radio" id="other" name="gender" value="other" />
      <label for="other">Other</label>
      <br /><br />

      <!-- Age -->
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" />
      <br /><br />

      <!-- Preferences -->
      <label>Preferences:</label><br />

      <input
        type="checkbox"
        id="acrylic"
        name="hobby"
        value="Acrylic Painting"
      />
      <label for="acrylic">Acrylic Painting</label><br />

      <input type="checkbox" id="oil" name="hobby" value="Oil Painting" />
      <label for="oil">Oil Painting</label><br />

      <input
        type="checkbox"
        id="watercolor"
        name="hobby"
        value="Water Color Painting"
      />
      <label for="watercolor">Water Color Painting</label>
      <br /><br />

      <!-- Occupation -->
      <label for="occupation">Select Occupation:</label>
      <select id="occupation" name="occupation">
        <option value="">--Select--</option>
        <option value="student">Student</option>
        <option value="engineering">Engineering</option>
        <option value="diploma">Diploma</option>
        <option value="bpharm">B-Pharm</option>
        <option value="dpharm">D-Pharm</option>
        <option value="law">Law</option>
      </select>
      <br /><br />

      <!-- Bio -->
      <label for="bio">Bio:</label><br />
      <textarea
        id="bio"
        name="bio"
        rows="4"
        cols="30"
        placeholder="Share few lines about yourself..."
      ></textarea>
      <br /><br />

      <!-- Buttons -->
      <button type="reset">Reset</button>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
