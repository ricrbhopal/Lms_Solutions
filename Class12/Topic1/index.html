<!doctype html>
<html>
  <head>
    <title>CSS Display Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- 1 -->
    <span class="block-span">Span as block</span>

    <!-- 2 -->
    <span class="block-span">Span 1</span>
    <span class="block-span">Span 2</span>

    <!-- 3 -->
    <div class="inline-div">Div 1</div>
    <div class="inline-div">Div 2</div>

    <!-- 4 -->
    <span class="inline-text">Inline 1</span>
    <span class="inline-text">Inline 2</span>
    <span class="inline-text">Inline 3</span>

    <!-- 5 -->
    <span class="inline-size">Inline Box</span>

    <!-- 6 -->
    <div class="inline-block">Box 1</div>
    <div class="inline-block">Box 2</div>

    <!-- 7 -->
    <div class="box">Box A</div>
    <div class="box">Box B</div>

    <!-- 8 -->
    <div class="layout-box">L1</div>
    <div class="layout-box">L2</div>
    <div class="layout-box">L3</div>

    <!-- 9 -->
    <div class="space-box">S1</div>
    <div class="space-box">S2</div>

    <!-- 10 -->
    <div class="hidden">This is hidden</div>

    <!-- 11 -->
    <div class="visible-box">Visible 1</div>
    <div class="hidden">Hidden Box</div>
    <div class="visible-box">Visible 2</div>

    <!-- 12 -->
    <h2>All Display Types</h2>
    <div class="block">Block</div>
    <span class="inline">Inline</span>
    <div class="inline-block-demo">Inline-Block</div>
    <div class="none">None (Hidden)</div>
  </body>
</html>
