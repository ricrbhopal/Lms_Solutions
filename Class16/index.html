<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Variables & Responsive Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Variables Practice -->
  <section class="box">Variable Box 1</section>
  <section class="box">Variable Box 2</section>

  <!-- Local Variable -->
  <div class="container">
    <p>Inside Container (Local Variable)</p>
  </div>

  <!-- Global vs Local -->
  <p class="global">Global Variable</p>
  <p class="local">Local Variable Override</p>

  <!-- Fallback -->
  <p class="fallback">Fallback Variable Example</p>

  <!-- Theme -->
  <div class="light-theme">Light Theme</div>
  <div class="dark-theme">Dark Theme</div>

  <!-- Responsive Layout -->
  <div class="layout">
    <aside class="sidebar">Sidebar</aside>
    <main class="content">Main Content</main>
  </div>

  <!-- Responsive Image -->
  <div class="img-container">
    <img src="image.png" alt="sample">
  </div>

  <!-- Flexbox -->
  <div class="flex">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
  </div>

  <!-- Grid -->
  <div class="grid">
    <div>Grid 1</div>
    <div>Grid 2</div>
    <div>Grid 3</div>
    <div>Grid 4</div>
  </div>

  <!-- Final UI -->
  <header class="header">Header</header>
  <div class="cards">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
  </div>

</body>
</html>
