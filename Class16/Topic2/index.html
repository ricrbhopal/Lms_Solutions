<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport Meta Tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Design Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>Responsive Web Design</h1>
  </header>

  <!-- Flexible Box -->
  <section class="box-section">
    <div class="responsive-box">Resizable Box</div>
  </section>

  <!-- Two Equal Sections -->
  <section class="split-screen">
    <div class="left">Left Section</div>
    <div class="right">Right Section</div>
  </section>

  <!-- Sidebar Layout -->
  <section class="layout">
    <aside class="sidebar">Sidebar</aside>
    <main class="main-content">Main Content Area</main>
  </section>

  <!-- Responsive Image -->
  <section class="image-section">
    <img src="https://via.placeholder.com/600x300" alt="Sample Image">
  </section>

  <!-- Flex Wrap Example -->
  <section class="flex-wrap-container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
  </section>

  <!-- Grid Gallery -->
  <section class="grid-gallery">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="card">Card 4</div>
  </section>

  <!-- Blog Layout -->
  <section class="blog-layout">
    <article>Blog Post 1</article>
    <article>Blog Post 2</article>
  </section>

  <!-- Responsive Navbar -->
  <nav class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>

</body>
</html>
