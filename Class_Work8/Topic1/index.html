<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anchor Tag Practice</title>
</head>
<body>

  <!-- Top Section -->
  <h1 id="top">Anchor Tag Practice</h1>

  <!-- 1. Simple link to Google -->
  <p><a href="https://www.google.com">Open Google</a></p>

  <!-- 2. Open example.com in new tab -->
  <p><a href="https://example.com" target="_blank">Open Example</a></p>

  <!-- 3. Internal page link -->
  <p><a href="about.html">Go to About Page</a></p>

  <!-- 4. Email link -->
  <p><a href="mailto:contact@ricr.in">Send Email</a></p>

  <!-- 5. Phone link -->
  <p><a href="tel:8889991736">Call Now</a></p>

  <!-- 6. Jump to bottom section -->
  <p><a href="#bottom">Go to Bottom Section</a></p>

  <!-- 7. Two links -->
  <p>
    <a href="https://www.google.com">Google</a> |
    <a href="about.html">About</a>
  </p>

  <!-- 8. Visit website in new tab -->
  <p><a href="https://example.com" target="_blank">Visit Website</a></p>

  <!-- 9. 3 links (Website, Email, Phone) -->
  <p>
    <a href="https://example.com">Website</a> |
    <a href="mailto:contact@ricr.in">Email</a> |
    <a href="tel:8889991736">Phone</a>
  </p>

  <!-- 10. Navigation menu -->
  <nav>
    <a href="#">Home</a> |
    <a href="about.html">About</a> |
    <a href="#contact">Contact</a>
  </nav>

  <br><br><br><br><br><br><br><br><br><br>

  <!-- Contact Section -->
  <h2 id="contact">Contact Section</h2>
  <p>This is the contact section.</p>

  <!-- Bottom Section -->
  <h2 id="bottom">Bottom Section</h2>

  <!-- 11. Go to Top -->
  <p><a href="#top">Go to Top</a></p>

</body>
</html>
