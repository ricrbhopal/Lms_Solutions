<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iframe Practice</title>
  </head>
  <body>
    <h1>Iframe Practice (All in One)</h1>

    <!-- 1. Basic iframe -->
    <h2>Basic Iframe</h2>
    <iframe src="https://example.com"></iframe>

    <!-- 2. Iframe with width & height -->
    <h2>Iframe with Size</h2>
    <iframe src="https://example.com" width="400" height="200"></iframe>

    <!-- 3. Iframe with title -->
    <h2>Iframe with Title</h2>
    <iframe
      src="https://example.com"
      width="400"
      height="200"
      title="Example Website"
    ></iframe>

    <!-- 4. Wikipedia iframe -->
    <h2>Wikipedia Page</h2>
    <iframe
      src="https://en.wikipedia.org/wiki/HTML"
      width="500"
      height="300"
      title="Wikipedia HTML Page"
    ></iframe>

    <!-- 5. YouTube embed -->
    <h2>YouTube Video</h2>
    <iframe
      width="500"
      height="300"
      src="https://www.youtube.com/embed/v7CgOVFOqLc?list=PLo2CRHpYM0iQMVq_ZFj--1CV0QvjOXNQF"
      title="Image Tag &amp; Link Tag In HTML| #9 | MERN FullStack Development"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- 6. YouTube with fullscreen -->
    <h2>YouTube with Fullscreen</h2>
    <iframe
      width="100%"
      height="570"
      src="https://www.youtube.com/embed/YGUSPjk2ebM?list=PLo2CRHpYM0iQMVq_ZFj--1CV0QvjOXNQF"
      title="Form Tags In HTML| #6 | MERN FullStack Development"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- 7. Lazy loading -->
    <h2>Lazy Loading Iframe</h2>
    <iframe src="https://example.com" width="400" height="200" loading="lazy">
    </iframe>

    <!-- 8. No border -->
    <h2>Iframe without Border</h2>
    <iframe src="https://example.com" width="400" height="200" frameborder="0">
    </iframe>

    <!-- 9. Two iframes -->
    <h2>Two Iframes</h2>
    <iframe src="https://example.com" width="400" height="200"></iframe>
    <br /><br />
    <iframe
      width="400"
      height="200"
      src="https://www.youtube.com/embed/QdmaRI-6rPE?list=PLo2CRHpYM0iQMVq_ZFj--1CV0QvjOXNQF"
      title="List Tags In HTML| #4 | MERN FullStack Development"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- 10. Complete example -->
    <h2>Complete Iframe Example</h2>
    <iframe
      width="500"
      height="300"
      src="https://www.youtube.com/embed/DENy2pqdkP0?list=PLo2CRHpYM0iQMVq_ZFj--1CV0QvjOXNQF"
      title="Table Tags In HTML| #5 | MERN FullStack Development"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
