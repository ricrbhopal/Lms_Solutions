<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Audio & Video Practice</title>
  </head>
  <body>
    <!-- 1. Simple audio with controls -->
    <h2>Simple Audio Player</h2>
    <audio controls>
      <source src="audio/sample.mp3" type="audio/mpeg" />
    </audio>

    <!-- 2. Autoplay audio -->
    <h2>Autoplay Audio</h2>
    <audio controls autoplay>
      <source src="audio/sample.mp3" type="audio/mpeg" />
    </audio>

    <!-- 3. Loop audio -->
    <h2>Loop Audio</h2>
    <audio controls loop>
      <source src="audio/sample.mp3" type="audio/mpeg" />
    </audio>

    <!-- 4. Muted audio -->
    <h2>Muted Audio</h2>
    <audio controls muted>
      <source src="audio/sample.mp3" type="audio/mpeg" />
    </audio>

    <!-- 5. Multiple audio formats -->
    <h2>Audio with Multiple Formats</h2>
    <audio controls>
      <source src="audio/sample.mp3" type="audio/mpeg" />
      <source src="audio/sample.ogg" type="audio/ogg" />
      Your browser does not support audio.
    </audio>

    <!-- 6. Simple video -->
    <h2>Simple Video Player</h2>
    <video controls>
      <source src="video/sample.mp4" type="video/mp4" />
    </video>

    <!-- 7. Video with width and height -->
    <h2>Video with Size</h2>
    <video controls width="400" height="250">
      <source src="video/sample.mp4" type="video/mp4" />
    </video>

    <!-- 8. Video with poster -->
    <h2>Video with Poster</h2>
    <video controls width="400" poster="images/poster.jpg">
      <source src="video/sample.mp4" type="video/mp4" />
    </video>

    <!-- 9. Video with multiple formats -->
    <h2>Video with Multiple Formats</h2>
    <video controls width="400">
      <source src="video/sample.mp4" type="video/mp4" />
      <source src="video/sample.webm" type="video/webm" />
      Your browser does not support video.
    </video>

    <!-- 10. Final Combined Example -->
    <h2>Complete Example</h2>

    <h3>Audio</h3>
    <audio controls>
      <source src="audio/sample.mp3" type="audio/mpeg" />
    </audio>

    <h3>Video</h3>
    <video controls width="400">
      <source src="video/sample.mp4" type="video/mp4" />
    </video>
  </body>
</html>
