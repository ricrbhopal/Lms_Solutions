<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Selectors Practice</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CSS Selectors Practice</h1>

  <!-- Paragraph (Element Selector) -->
  <p>This is a normal paragraph.</p>

  <!-- Class .note -->
  <p class="note">This is a note paragraph.</p>

  <!-- ID #header -->
  <div id="header">This is header section</div>

  <!-- .box applied to multiple elements -->
  <p class="box">Box Paragraph 1</p>
  <p class="box">Box Paragraph 2</p>
  <div class="box">Box Div</div>

  <!-- Universal selector example -->
  <h2>Universal Selector Example</h2>
  <p>This paragraph shows universal selector effect.</p>

</body>
</html>
