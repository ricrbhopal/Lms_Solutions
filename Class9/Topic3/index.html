<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Color Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>CSS Color Practice</h1>

    <p>This paragraph uses a color name.</p>

    <!-- div with background + text color -->
    <div class="box1">This div has background-color and text color.</div>

    <!-- HEX color -->
    <div class="box2">This div uses HEX background color.</div>

    <!-- RGB color -->
    <p class="rgb-text">This paragraph uses RGB color.</p>

    <!-- Dark background + light text -->
    <div class="dark-box">Dark background with light text.</div>

    <!-- padding example -->
    <div class="box3">This div has background, text color, and padding.</div>

    <!-- Contrast example -->
    <div class="contrast">High contrast text for readability.</div>
  </body>
</html>
